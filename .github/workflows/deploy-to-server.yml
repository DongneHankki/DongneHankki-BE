name: KernelLabs CICD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    #if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Copy files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "build/libs/*.jar"
          target: "/home/${{ secrets.SERVER_USER }}/deploy-temp"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/deploy-temp

            # 2. Create application-prod.yml on the server
            mkdir -p src/main/resources
            echo "${{ secrets.PROPERTIES_PROD }}" > src/main/resources/application-prod.yml

            # 4. Build Docker Image on the server
            docker stop dongnehankki || true
            docker rm dongnehankki || true
            docker rmi dongnehankki:latest || true
            docker build --no-cache -t dongnehankki:latest .

            # 5. Stop, remove, and run the Docker container
            docker run -d \
            --name dongnehankki \
            --network attendance-deploy_attendance-net  \
            --label traefik.enable=true \
            --label 'traefik.http.routers.dongnehankki.rule=Host(`dh.porogramr.site`)' \
            --label traefik.http.routers.dongnehankki.entrypoints=websecure \
            --label traefik.http.routers.dongnehankki.tls=true \
            --label traefik.http.routers.dongnehankki.tls.certresolver=letsencrypt \
            --label traefik.http.services.dongnehankki.loadbalancer.server.port=8083 \
            -e TZ=Asia/Seoul \
            -e SPRING_PROFILES_ACTIVE=prod \
            -p 8083:8083 \
            dongnehankki:latest

